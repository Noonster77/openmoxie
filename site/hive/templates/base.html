<!DOCTYPE html>
{% load django_bootstrap5 %}
{% load static %}
<html>
<head>
    <title>Open Moxie Hive Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% bootstrap_css %}
    <script src="{% static 'js/jquery.js' %}"></script>
    <link rel="stylesheet" href="{% static 'hive/style.css' %}?v={{moxie_version}}-ui3">
    <link rel="icon" type="image/svg+xml" href="{% static 'hive/favicon.svg' %}" sizes="any">
</head>
<body>
    <nav class="app-nav">
      <a class="brand" href="{% url 'hive:dashboard' %}"><img src="{% static 'hive/openmoxie_logo.svg' %}" alt="OpenMoxie"> <span>OpenMoxie</span></a>
      <div class="nav-links"><a href="{% url 'hive:dashboard' %}">Control Center</a><a href="{% url 'hive:setup' %}">AI &amp; Network</a><a href="{% url 'admin:index' %}">Advanced</a></div>
      <span class="version-chip">v{{moxie_version}}</span>
    </nav>
    <div id="content" class="app-shell">
        {% block content %}{% endblock %}
    </div>
    <footer class="app-footer">Local-first Moxie control &bull; Keep this service on your trusted home network</footer>
    {% bootstrap_javascript %}
</body>
</html>
